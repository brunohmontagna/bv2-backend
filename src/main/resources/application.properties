spring.application.name=bv2-projeto-software-uepg

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bv2}
spring.datasource.username=${DB_USERNAME:bv2}
spring.datasource.password=${DB_PASSWORD:bv2}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
# open-in-view=false: Cliente.usuario e LAZY; sem isso um N+1 ficaria mascarado
# pela sessao aberta na camada de view em vez de aparecer nos testes.
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# n8n — notificacoes por WhatsApp na troca de status da OS.
# URL em branco desliga a integracao: a aplicacao sobe normalmente e as
# notificacoes ficam FALHOU, visiveis em GET /notificacoes.
n8n.webhook.url=${N8N_WEBHOOK_URL:}
n8n.webhook.token=${N8N_WEBHOOK_TOKEN:}
n8n.webhook.timeout-segundos=${N8N_WEBHOOK_TIMEOUT_SEGUNDOS:10}

# E-mail (recuperacao de senha) — suporte@bv2.tech, hospedado na Hostinger.
# Usuario em branco desliga o envio: a aplicacao sobe normalmente, o token continua
# sendo gravado, so o e-mail nao sai.
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true

# A porta 465 e SSL implicito: a conexao ja nasce criptografada. STARTTLS e o oposto
# — abre em texto claro na 587 e negocia depois. Ligar o modo errado para a porta faz
# a conexao travar ate o timeout com EOFException e nenhuma mensagem util.
# Para usar a 587, inverta os dois valores.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Sem timeout explicito, um SMTP que aceita a conexao e nao responde prende a thread
# da requisicao indefinidamente. O envio aqui e sincrono.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# O remetente precisa ser a mesma conta que autentica no SMTP: divergir derruba o
# envio com "sender address rejected". So o nome de exibicao e livre.
app.mail.remetente=${MAIL_FROM:suporte@bv2.tech}
app.mail.remetente-nome=${MAIL_FROM_NOME:Suporte BV2}

# Base do link enviado por e-mail. Aponta para a tela do front, nao para a API.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.recuperacao-senha.expiracao-minutos=${RECUPERACAO_SENHA_EXPIRACAO_MINUTOS:30}
app.alteracao-email.expiracao-minutos=${ALTERACAO_EMAIL_EXPIRACAO_MINUTOS:30}
