name: Deploy backend (VPS / Docker Swarm)

# Push na main: testa, gera a imagem, publica no GHCR e atualiza o servico bv2_api
# no Swarm da VPS. workflow_dispatch permite reexecutar o deploy na mao.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; o seguinte espera o atual terminar (nao cancela no meio).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/brunohmontagna/bv2-backend
  API_URL: https://api.bv2.tech

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bv2
          POSTGRES_USER: bv2
          POSTGRES_PASSWORD: bv2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bv2 -d bv2"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: bv2
      DB_USERNAME: bv2
      DB_PASSWORD: bv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  build:
    name: Build e push da imagem
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Swarm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.API_URL }}/swagger-ui.html
    env:
      TAG: ${{ needs.build.outputs.tag }}
      REMOTE: deploy@${{ secrets.VPS_HOST }}
    steps:
      # Secret inexistente vira string vazia sem erro nenhum, e o sintoma aparece la
      # na frente como "Could not resolve hostname". Falha aqui, dizendo qual falta.
      - name: Conferir secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          faltando=0
          for s in VPS_HOST VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s nao cadastrado (Settings > Secrets and variables > Actions)"; faltando=1; fi
          done
          exit $faltando

      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Enviar stack.yml
        run: scp deploy/stack.yml "$REMOTE:/opt/bv2-api/stack.yml"

      - name: docker stack deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O token do job so vive durante o workflow. Basta para o pull deste deploy:
          # com um unico no, a imagem fica em cache e restarts nao precisam de novo pull.
          printf '%s' "$GHCR_TOKEN" | ssh "$REMOTE" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$REMOTE" "cd /opt/bv2-api && IMAGE_TAG='$TAG' docker stack deploy --with-registry-auth --detach=false -c stack.yml bv2"
          ssh "$REMOTE" "docker logout ghcr.io"

      - name: Conferir convergencia (rollback = falha)
        run: |
          ssh "$REMOTE" bash -s -- "$TAG" <<'EOF'
          set -e
          estado=$(docker service inspect bv2_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}created{{end}}')
          imagem=$(docker service inspect bv2_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          docker service ls --filter name=bv2_api
          echo "update: $estado | imagem: $imagem"
          case "$imagem" in *":$1@"*|*":$1") ;; *) echo "imagem nao e a $1"; exit 1;; esac
          case "$estado" in completed|created) ;; *) echo "deploy nao convergiu ($estado)"; exit 1;; esac
          EOF

      - name: Smoke test
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/id_ed25519
